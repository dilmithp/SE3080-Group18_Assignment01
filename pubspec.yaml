name: elderly_companion
description: "Elderly Companionship & Micro-Volunteering Platform — SE3080 Group 018."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Value equality / serialization (data layer DTOs only — see docs/DATA_MODEL.md)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional error handling
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.0.4

  # Typography — Atkinson Hyperlegible (body) + Lexend (headings). Both are
  # legibility-first typefaces; see lib/core/theme/app_typography.dart.
  google_fonts: ^6.2.1

  # Persistence for accessibility preferences
  shared_preferences: ^2.2.3

  # Identity-document capture for auth_trust verification
  image_picker: ^1.1.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
